<div class="container">
  <div class="form-wrapper card">
    <div class="form-banner">
      <div>
        <h1>{{ modoEdicao ? 'Editar Registro do Catálogo' : 'Cadastrar Novo Equipamento ou Trilha' }}</h1>
        <p>Manipulação de dados via SemcService (Mock Objects em memória) utilizando Two-Way Data Binding.</p>
      </div>
      <span class="admin-badge">🔒 GERENCIAMENTO SEMC</span>
    </div>

    <div class="error-box" *ngIf="mensagemErro">
      {{ mensagemErro }}
    </div>

    <form (ngSubmit)="salvarFormulario()" class="semc-form">
      <div class="form-row-3">
        <div class="form-group">
          <label>Tipo de Registro *</label>
          <select class="form-control" [(ngModel)]="tipo" name="tipo">
            <option value="Equipamento">Equipamento de Sobrevivência / Camping</option>
            <option value="Trilha">Rota de Trilha / Expedição</option>
          </select>
        </div>

        <div class="form-group">
          <label>Código Identificador *</label>
          <input type="text" class="form-control" [(ngModel)]="codigo" name="codigo" placeholder="Ex: EQP-055 ou TRL-112" />
        </div>

        <div class="form-group">
          <label>Status Atual *</label>
          <select class="form-control" [(ngModel)]="status" name="status">
            <option value="Disponível">Disponível no Inventário</option>
            <option value="Em Campo">Em Campo / Expedição</option>
            <option value="Planejado">Planejado</option>
            <option value="Concluído">Concluído</option>
          </select>
        </div>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label>Nome do Equipamento ou Trilha *</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="nome"
            name="nome"
            placeholder="Ex: Lanterna Tática Recarregável 1200 Lumens SEMC"
          />
        </div>

        <div class="form-group">
          <label>Categoria *</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="categoria"
            name="categoria"
            placeholder="Ex: Iluminação & Sinalização, Abrigo, Cutelaria..."
          />
        </div>
      </div>

      <div class="form-row-3">
        <div class="form-group">
          <label>Peso Estimado (em gramas) *</label>
          <input type="number" class="form-control" [(ngModel)]="pesoGramas" name="pesoGramas" />
        </div>

        <div class="form-group">
          <label>Nível de Criticidade / Dificuldade *</label>
          <select class="form-control" [(ngModel)]="dificuldadeOuCriticidade" name="dificuldadeOuCriticidade">
            <option value="Essencial (EDC)">Essencial (EDC)</option>
            <option value="Leve">Leve</option>
            <option value="Moderada">Moderada</option>
            <option value="Difícil">Difícil</option>
          </select>
        </div>

        <div class="form-group">
          <label>Responsável ou Localização *</label>
          <input type="text" class="form-control" [(ngModel)]="localOuResponsavel" name="localOuResponsavel" />
        </div>
      </div>

      <div class="form-group">
        <label>Especificações Técnicas e Descrição de Campo *</label>
        <textarea
          rows="3"
          class="form-control"
          [(ngModel)]="descricao"
          name="descricao"
          placeholder="Descreva os materiais, resistência à água, autonomia ou detalhes da rota..."
        ></textarea>
      </div>

      <div class="form-group">
        <label>Checklist Associado (digite 1 item por linha)</label>
        <textarea
          rows="4"
          class="form-control"
          [(ngModel)]="checklistTexto"
          name="checklistTexto"
        ></textarea>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="destaqueCheck" [(ngModel)]="destaque" name="destaque" />
        <label for="destaqueCheck">Exibir este registro nos destaques da Página Inicial (Home)</label>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">
          {{ modoEdicao ? 'Salvar Alterações (Atualizar)' : 'Salvar no Catálogo SEMC' }}
        </button>
        <button type="button" class="btn btn-outline" (click)="limparCampos()">
          Limpar Campos
        </button>
        <a routerLink="/catalogo" class="btn btn-secondary">
          Cancelar e Voltar
        </a>
      </div>
    </form>
  </div>
</div>
